[project]
name = "career-agent"
version = "0.1.0"
description = "Career decision platform for collecting, analyzing and ranking job opportunities."
readme = "README.md"
authors = [
    { name = "mbotre", email = "[other@gmail.com]" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "requests",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
